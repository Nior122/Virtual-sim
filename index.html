<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Babe</title>
    <meta name="description" content="Meet verified companions and creators for 1-on-1 video calls and messaging." />
    <meta property="og:title" content="Dream Babe" />
    <meta property="og:description" content="Meet verified companions and creators for 1-on-1 video calls and messaging." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#07080e" />
    <script>
      /* Apply the saved theme before the first paint. Without this a visitor
         who chose light mode sees the dark shell flash on every reload, which
         is exactly what made the old toggle look broken. */
      (function () {
        try {
          var saved = localStorage.getItem("dreamgirl_theme");
          var theme = saved === "light" || saved === "dark" ? saved : "dark";
          var root = document.documentElement;
          root.classList.add(theme);
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f5f6fa" : "#07080e");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
